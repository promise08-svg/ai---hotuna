<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212121">
<title>Hotuna AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root {
    --bg:#212121; --side:#171717; --panel:#2f2f2f; --panel2:#3a3a3a; --text:#ececec; --muted:#9b9b9b;
    --accent:#10a37f; --user:#303030; --border:#3d3d3d; --code:#171717; --danger:#ff8a80; --link:#6ab0ff;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg:#ffffff; --side:#f7f7f8; --panel:#f0f0f1; --panel2:#e4e4e6; --text:#0d0d0d; --muted:#6b6b6b;
    --user:#efefef; --border:#e2e2e4; --code:#f6f6f7; --danger:#c62828; --link:#1a6fd4;
    color-scheme: light;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg); color:var(--text); display:flex; height:100dvh; overflow:hidden;
  }
  button { font-family:inherit; color:inherit; }
  .hidden { display:none !important; }

  /* ----- sidebar ----- */
  .side { width:280px; flex:none; background:var(--side); border-right:1px solid var(--border); display:flex; flex-direction:column; height:100dvh; }
  .side-top { padding:12px; display:flex; flex-direction:column; gap:10px; }
  .btn { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:15px; cursor:pointer; text-align:left; }
  .btn:active { background:var(--panel2); }
  .btn.primary { display:flex; align-items:center; gap:8px; font-weight:600; }
  .search { width:100%; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:9px 12px; font-size:14px; color:var(--text); outline:none; }
  .clist { flex:1; overflow-y:auto; padding:0 8px 12px; }
  .citem { display:flex; align-items:center; gap:4px; padding:9px 10px; border-radius:10px; cursor:pointer; font-size:14.5px; }
  .citem:hover, .citem.active { background:var(--panel); }
  .citem .ct { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .citem button { background:none; border:none; padding:4px 6px; cursor:pointer; opacity:.7; font-size:14px; }
  .citem button:hover { opacity:1; }
  .nochats { color:var(--muted); font-size:14px; padding:14px 12px; }
  .scrim { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:25; }

  /* ----- main ----- */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; height:100dvh; position:relative; }
  header { display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--border); }
  header .ttl { flex:1; min-width:0; font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }
  .ibtn { width:38px; height:38px; flex:none; border:none; border-radius:10px; background:transparent; font-size:20px; cursor:pointer; display:grid; place-items:center; }
  .ibtn:active, .ibtn:hover { background:var(--panel); }
  #menuBtn { display:none; }
  @media (max-width:860px) {
    #menuBtn { display:grid; }
    .side { position:fixed; left:0; top:0; bottom:0; z-index:30; width:min(86vw,320px); transform:translateX(-100%); transition:transform .2s ease; }
    body.sideopen .side { transform:none; }
    body.sideopen .scrim { display:block; }
  }

  #chat { flex:1; overflow-y:auto; padding:18px 14px 8px; overscroll-behavior:contain; }
  .wrap { max-width:780px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }
  .toBottom { position:absolute; right:16px; bottom:110px; width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--panel); cursor:pointer; font-size:18px; z-index:5; }

  .empty { text-align:center; margin-top:7vh; }
  .logo { width:30px; height:30px; border-radius:50%; background:var(--accent); display:grid; place-items:center; font-size:15px; color:#fff; flex:none; }
  .empty .logo { width:56px; height:56px; font-size:28px; margin:0 auto 16px; }
  .empty h2 { margin:0 0 6px; font-size:24px; }
  .empty p { margin:0 0 6px; color:var(--muted); }
  .empty .first { font-size:12.5px; margin-bottom:20px; }
  .chips { display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left; }
  .chip { background:var(--panel); border:1px solid var(--border); padding:13px 12px; border-radius:14px; font-size:14px; cursor:pointer; line-height:1.35; }
  .chip:active { background:var(--panel2); }
  @media (max-width:520px) { .chips { grid-template-columns:1fr; } }

  .msg { display:flex; gap:10px; }
  .msg.user { justify-content:flex-end; }
  .ucol { display:flex; flex-direction:column; align-items:flex-end; gap:6px; max-width:86%; }
  .bubble { padding:10px 15px; border-radius:20px; background:var(--user); white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere; line-height:1.5; }
  .fchip { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:6px 10px; font-size:13px; }
  .bcol { flex:1; min-width:0; }
  .msg .avatar { margin-top:2px; }
  .body { line-height:1.6; overflow-wrap:anywhere; }
  .body p { margin:0 0 10px; } .body p:last-child { margin-bottom:0; }
  .body h1,.body h2,.body h3,.body h4 { margin:14px 0 6px; line-height:1.3; }
  .body h1 { font-size:21px; } .body h2 { font-size:18.5px; } .body h3 { font-size:16.5px; } .body h4 { font-size:15.5px; }
  .body ul,.body ol { margin:4px 0 10px; padding-left:22px; } .body li { margin:3px 0; }
  .body blockquote { margin:8px 0; padding:2px 12px; border-left:3px solid var(--border); color:var(--muted); }
  .body hr { border:none; border-top:1px solid var(--border); margin:14px 0; }
  .body a { color:var(--link); }
  .body code { background:var(--panel); padding:2px 6px; border-radius:6px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.9em; }
  .code { background:var(--code); border:1px solid var(--border); border-radius:12px; margin:10px 0; overflow:hidden; }
  .codehead { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:var(--panel); font-size:12.5px; color:var(--muted); }
  .codehead button { background:none; border:none; cursor:pointer; font-size:12.5px; color:var(--muted); padding:2px 4px; }
  .code pre { margin:0; padding:12px; overflow-x:auto; }
  .code pre code { background:none; padding:0; font-size:13px; }
  .tablewrap { overflow-x:auto; margin:10px 0; }
  table { border-collapse:collapse; font-size:14px; min-width:60%; }
  th, td { border:1px solid var(--border); padding:6px 10px; }
  th { background:var(--panel); }
  figure { margin:8px 0 0; } figure img { max-width:100%; max-height:70vh; border-radius:14px; display:block; cursor:zoom-in; }
  .ucol figure { margin:0; } .ucol figure img { max-height:220px; }
  .dl { display:inline-block; margin-top:6px; color:var(--accent); font-size:14px; text-decoration:none; }
  .status { color:var(--muted); display:flex; align-items:center; gap:8px; margin-top:6px; }
  .dots { white-space:nowrap; flex:none; }
  .dots span { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--muted); margin-right:3px; animation:blink 1.2s infinite both; }
  .dots span:nth-child(2) { animation-delay:.2s; } .dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100% { opacity:.2; } 40% { opacity:1; } }
  .err { color:var(--danger); margin-top:6px; }
  .err button { margin-left:6px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:3px 8px; cursor:pointer; }
  .actions { display:flex; gap:2px; margin-top:4px; opacity:.75; }
  .actions button { background:none; border:none; cursor:pointer; padding:4px 7px; border-radius:8px; font-size:15px; }
  .actions button:hover { background:var(--panel); }
  .msg.user .actions { justify-content:flex-end; }

  /* ----- composer ----- */
  .composer { padding:6px 12px calc(10px + env(safe-area-inset-bottom)); }
  .cbox { max-width:780px; margin:0 auto; background:var(--panel); border:1px solid var(--border); border-radius:26px; padding:6px 8px 6px 8px; }
  .apreview { display:flex; align-items:center; gap:8px; padding:4px 8px 6px; }
  .apreview img { width:48px; height:48px; object-fit:cover; border-radius:10px; }
  .apreview .nm { flex:1; min-width:0; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .apreview button { border:none; background:var(--panel2); border-radius:50%; width:24px; height:24px; cursor:pointer; }
  .crow { display:flex; align-items:flex-end; gap:4px; }
  textarea#prompt { flex:1; resize:none; border:none; outline:none; background:transparent; color:var(--text); font-size:16px; font-family:inherit; line-height:1.4; max-height:140px; padding:10px 4px; min-height:42px; }
  textarea::placeholder { color:var(--muted); }
  .tbtn { flex:none; width:38px; height:38px; border:none; border-radius:50%; background:transparent; font-size:19px; cursor:pointer; display:grid; place-items:center; }
  .tbtn:hover { background:var(--panel2); }
  .tbtn.on { background:var(--accent); color:#fff; }
  #send { flex:none; width:38px; height:38px; border:none; border-radius:50%; background:var(--text); color:var(--bg); font-size:17px; cursor:pointer; display:grid; place-items:center; }
  #send:disabled { opacity:.35; cursor:default; }
  .note { text-align:center; color:var(--muted); font-size:11.5px; margin-top:6px; }

  /* ----- modal / toast / lightbox ----- */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; display:flex; align-items:center; justify-content:center; padding:16px; }
  .sheet { background:var(--bg); border:1px solid var(--border); border-radius:18px; width:100%; max-width:460px; max-height:88dvh; overflow-y:auto; padding:18px; }
  .sheet h3 { margin:0 0 14px; font-size:18px; display:flex; justify-content:space-between; align-items:center; }
  .field { margin-bottom:14px; } .field label { display:block; font-size:13px; color:var(--muted); margin-bottom:5px; }
  .field select, .field textarea { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px; font-size:15px; font-family:inherit; }
  .field textarea { min-height:70px; resize:vertical; }
  .field .btn { width:100%; margin-top:6px; text-align:center; }
  .danger { color:var(--danger); }
  .toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:14px; z-index:60; max-width:88vw; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:50; display:flex; align-items:center; justify-content:center; cursor:zoom-out; }
  .lightbox img { max-width:96vw; max-height:92vh; }
</style>
</head>
<body>
  <div class="scrim" id="scrim"></div>

  <aside class="side" id="side">
    <div class="side-top">
      <button class="btn primary" id="newChatBtn" type="button">✚ <span data-i18n="newChat"></span></button>
      <input class="search" id="searchChats" type="search" data-i18n-ph="search" autocomplete="off">
    </div>
    <div class="clist" id="clist"></div>
    <div class="side-top"><button class="btn" id="settingsBtn2" type="button">⚙ <span data-i18n="settings"></span></button></div>
  </aside>

  <div class="main">
    <header>
      <button class="ibtn" id="menuBtn" type="button" aria-label="Menu">☰</button>
      <div class="ttl" id="titleEl"></div>
      <button class="ibtn" id="newBtn" type="button" aria-label="New chat">✚</button>
      <button class="ibtn" id="settingsBtn" type="button" aria-label="Settings">⚙</button>
    </header>

    <div id="chat"><div class="wrap" id="wrap"></div></div>
    <button class="toBottom hidden" id="toBottom" type="button" aria-label="Down">↓</button>

    <div class="composer">
      <div class="cbox">
        <div class="apreview hidden" id="apreview"></div>
        <div class="crow">
          <button class="tbtn" id="attachBtn" type="button" data-i18n-title="attach" aria-label="Attach">📎</button>
          <input type="file" id="fileInput" class="hidden" accept="image/*,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.log,.java,.c,.cpp,.php,.sql,text/*">
          <textarea id="prompt" rows="1" autocomplete="off"></textarea>
          <button class="tbtn" id="imgToggle" type="button" data-i18n-title="imgMode" aria-pressed="false">🖼</button>
          <button class="tbtn hidden" id="micBtn" type="button" data-i18n-title="mic">🎤</button>
          <button id="send" type="button" aria-label="Send">➤</button>
        </div>
      </div>
      <div class="note" id="note"></div>
    </div>
  </div>

  <div class="modal hidden" id="settingsModal">
    <div class="sheet">
      <h3><span data-i18n="settings"></span><button class="ibtn" id="closeSettings" type="button" aria-label="Close">✕</button></h3>
      <div class="field"><label data-i18n="language"></label>
        <select id="setLang"><option value="ha">Hausa</option><option value="en">English</option></select></div>
      <div class="field"><label data-i18n="theme"></label>
        <select id="setTheme"><option value="dark" data-i18n="themeDark"></option><option value="light" data-i18n="themeLight"></option><option value="auto" data-i18n="themeAuto"></option></select></div>
      <div class="field"><label data-i18n="chatModel"></label>
        <select id="setModel"></select>
        <button class="btn" id="loadModels" type="button" data-i18n="loadModels"></button></div>
      <div class="field"><label data-i18n="imageModel"></label>
        <select id="setImgModel"></select></div>
      <div class="field"><label data-i18n="custom"></label>
        <textarea id="setCustom" data-i18n-ph="customPh"></textarea></div>
      <div class="field"><button class="btn" id="exportBtn" type="button" data-i18n="export"></button>
        <button class="btn danger" id="delAllBtn" type="button" data-i18n="deleteAll"></button></div>
    </div>
  </div>

<script>
"use strict";
/* =========================================================
   Strings
   ========================================================= */
const T = {
  ha: {
    appName:"Hotuna AI", newChat:"Sabuwar tattaunawa", search:"Nemo tattaunawa...", noChats:"Babu tattaunawa tukuna",
    hello:"Sannu! Me zan taimaka maka yau?", sub:"Ka yi tambaya, ka nemi hoto, ko ka …ɗora hoto ko fayil.",
    firstUse:"A karon farko, Puter zai nemi ka shiga da asusu kyauta.",
    ph:"Rubuta saƙo...", thinking:"Ina tunani", makingImage:"Ana yin hoton", copy:"Kwafa", copied:"An kwafa",
    regen:"Sake amsawa", edit:"Gyara", stop:"Tsaya", attach:"Ɗora hoto ko fayil", imgMode:"Yi hoto", mic:"Yi magana",
    settings:"Saituna", language:"Harshe", theme:"Yanayi", themeDark:"Duhu", themeLight:"Haske", themeAuto:"Kai tsaye",
    chatModel:"Model na tattaunawa", imageModel:"Model na hoto", auto:"Kai tsaye (shawara)", loadModels:"Ɗauko jerin model",
    loadingModels:"Ana ɗauko...", modelsFail:"Ba a iya ɗauko jerin ba.", custom:"Umarni naka (zaɓi)",
    customPh:"Misali: Koyaushe ka amsa a taƙaice.", export:"Fitar da tattaunawa", deleteAll:"Share duk tattaunawa",
    confirmDelete:"Ka tabbata kana so ka share wannan tattaunawar?", confirmAll:"Ka share duk tattaunawa? Ba za a iya dawo da su ba.",
    rename:"Canza suna", renamePrompt:"Sabon suna:", del:"Share", download:"Sauke hoto",
    errGeneric:"An samu matsala. Ka sake gwadawa.",
    errBalance:"Kyautar Puter ta ƙare a yanzu. Ka jira sabon wata ko ka haɓaka asusun Puter.",
    errPuter:"Ba a iya loda Puter ba. Ka duba intanet ka sake loda shafin.",
    retry:"Sake gwadawa", note:"AI na iya yin kuskure. Ka duba muhimman bayanai.",
    fileBig:"Fayil ɗin ya yi girma (iyaka 10MB).", fileType:"Ba a goyi bayan wannan nau'in fayil ba.",
    stopped:"(an tsayar)", seeImage:"(duba hoton)", exported:"An fitar", imgPrompt:"Hoto",
    chips:[
      ["🖼 Yi mini hoton zaki a hamada","Yi mini hoton zaki a hamada lokacin faɗuwar rana"],
      ["✍️ Rubuta wasiƙar neman aiki","Rubuta mini wasiƙar neman aiki"],
      ["💡 Bayyana yadda AI yake aiki","Bayyana mini yadda AI yake aiki cikin sauƙi"],
      ["🌍 Fassara zuwa Turanci","Fassara mini wannan zuwa Turanci: Ina son in koyi shirye-shiryen kwamfuta."],
      ["📈 Dabarun ƙaramar kasuwa","Ba ni dabarun fara ƙaramar kasuwa da ƙaramin jari"],
      ["💻 Rubuta mini code","Rubuta mini ƙaramin shafin yanar gizo mai maɓalli, da code ɗin gaba ɗaya"]
    ]
  },
  en: {
    appName:"Hotuna AI", newChat:"New chat", search:"Search chats...", noChats:"No chats yet",
    hello:"Hello! How can I help you today?", sub:"Ask a question, request an image, or upload an image or file.",
    firstUse:"The first time, Puter will ask you to sign in with a free account.",
    ph:"Type a message...", thinking:"Thinking", makingImage:"Creating your image", copy:"Copy", copied:"Copied",
    regen:"Regenerate", edit:"Edit", stop:"Stop", attach:"Attach image or file", imgMode:"Create image", mic:"Speak",
    settings:"Settings", language:"Language", theme:"Theme", themeDark:"Dark", themeLight:"Light", themeAuto:"Auto",
    chatModel:"Chat model", imageModel:"Image model", auto:"Auto (recommended)", loadModels:"Load model list",
    loadingModels:"Loading...", modelsFail:"Could not load the model list.", custom:"Custom instructions (optional)",
    customPh:"e.g. Always answer briefly.", export:"Export chat", deleteAll:"Delete all chats",
    confirmDelete:"Delete this chat?", confirmAll:"Delete all chats? This cannot be undone.",
    rename:"Rename", renamePrompt:"New name:", del:"Delete", download:"Download image",
    errGeneric:"Something went wrong. Please try again.",
    errBalance:"Your free Puter allowance has run out for now. Wait for next month or upgrade your Puter account.",
    errPuter:"Puter could not load. Check your internet and reload the page.",
    retry:"Try again", note:"AI can make mistakes. Check important info.",
    fileBig:"File is too large (max 10 MB).", fileType:"This file type is not supported.",
    stopped:"(stopped)", seeImage:"(see image)", exported:"Exported", imgPrompt:"Image",
    chips:[
      ["🖼 Create an image of a lion","Create an image of a lion in the desert at sunset"],
      ["✍️ Write a job application","Write me a job application letter"],
      ["💡 Explain how AI works","Explain how AI works in simple terms"],
      ["🌍 Translate to Hausa","Translate this to Hausa: I want to learn computer programming."],
      ["📈 Small business ideas","Give me ideas to start a small business with little capital"],
      ["💻 Write some code","Write me a small web page with a button, with the full code"]
    ]
  }
};
T.ha.sub = "Ka yi tambaya, ka nemi hoto, ko ka ɗora hoto ko fayil.";

/* image models the user can pick (ids from Puter docs) */
const FLUX = "@cf/black-forest-labs/flux-1-schnell";
const IMAGE_MODELS = [
  ["", "auto"],
  ["gpt-image-2", "GPT Image 2"],
  ["gemini-3.1-flash-image", "Gemini (Nano Banana)"],
  ["grok-imagine-image", "Grok Imagine"],
  [FLUX, "FLUX (fast / cheap)"]
];

/* =========================================================
   Settings + utils
   ========================================================= */
const S = { lang:"ha", theme:"dark", model:"", imgModel:"", custom:"" };
(function loadSettings() {
  try { Object.assign(S, JSON.parse(localStorage.getItem("hotuna.settings") || "{}")); } catch (e) {}
})();
function saveSettings() { try { localStorage.setItem("hotuna.settings", JSON.stringify(S)); } catch (e) {} }
const t = function (k) { return (T[S.lang] && T[S.lang][k] !== undefined) ? T[S.lang][k] : (T.en[k] !== undefined ? T.en[k] : k); };
const $ = function (id) { return document.getElementById(id); };
function uid() { try { return crypto.randomUUID(); } catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2); } }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

let toastTimer = null;
function toast(msg) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.style.display = "none"; }, 1800);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e2) {} ta.remove();
  }
  toast(t("copied"));
}
function applyTheme() {
  let th = S.theme;
  if (th === "auto") th = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", th);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = th === "light" ? "#ffffff" : "#212121";
}
function applyLang() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(function (el) { el.placeholder = t(el.getAttribute("data-i18n-ph")); });
  document.querySelectorAll("[data-i18n-title]").forEach(function (el) { el.title = t(el.getAttribute("data-i18n-title")); });
  $("prompt").placeholder = t("ph");
  $("note").textContent = t("note");
  fillImgModelSelect();
  renderChat(); renderList();
}

/* =========================================================
   Storage (IndexedDB, in-memory fallback)
   ========================================================= */
const DB = (function () {
  let db = null, ok = false; const mem = new Map();
  function open() {
    return new Promise(function (res) {
      try {
        const r = indexedDB.open("hotuna", 1);
        r.onupgradeneeded = function () { r.result.createObjectStore("chats", { keyPath: "id" }); };

   Markdown (safe: everything is escaped first)
   ========================================================= */
function inline(s) {
  const codes = [];
  s = String(s).replace(/`([^`\n]+)`/g, function (_, c) { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  s = s.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>").replace(/__([^_\n]+?)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~\n]+?)~~/g, "<del>$1</del>");
  s = s.replace(/\u0000(\d+)\u0000/g, function (_, n) { return "<code>" + esc(codes[+n]) + "</code>"; });
  return s;
}
function codeBlock(code, lang) {

}
function mdList(items) {
  let html = "", stack = [];
  items.forEach(function (it) {
    while (stack.length && it.indent < stack[stack.length - 1].indent) html += "</li></" + stack.pop().tag + ">";
    const top = stack[stack.length - 1];
    if (!top || it.indent > top.indent) {
      const tag = it.ordered ? "ol" : "ul";
      stack.push({ indent: it.indent, tag: tag });
      html += "<" + tag + (it.ordered && it.num > 1 ? ' start="' + it.num + '"' : "") + "><li>" + inline(it.text);
    } else html += "</li><li>" + inline(it.text);
  });
  while (stack.length) html += "</li></" + stack.pop().tag + ">";

}
const LIST_RE = /^(\s*)([-*+•]|\d+[.)])\s+(.*)$/;
const TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
function splitRow(l) { l = l.trim(); if (l.charAt(0) === "|") l = l.slice(1); if (l.charAt(l.length - 1) === "|") l = l.slice(0, -1); return l.split("|").map(function (c) { return c.trim(); }); }
function md(src) {
  const lines = String(src).replace(/\r/g, "").split("\n");
  let out = "", i = 0, para = [];
  const flush = function () { if (para.length) { out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  while (i < lines.length) {
    const line = lines[i]; let m;
    if ((m = line.match(/^\s*```\s*([\w+#.-]*)\s*$/))) {
      flush(); const buf = []; i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; out += codeBlock(buf.join("\n"), m[1]); continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flush(); out += "<hr>"; i++; continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flush(); out += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"; i++; continue; }
    if (/^\s*>\s?/.test(line)) {
      flush(); const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out += "<blockquote>" + md(buf.join("\n")) + "</blockquote>"; continue;
    }
    if (line.indexOf("|") >= 0 && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1]) && lines[i + 1].indexOf("-") >= 0) {
      flush();
      const head = splitRow(line);
      const al = splitRow(lines[i + 1]).map(function (c) { return /^:-+:$/.test(c) ? "center" : /-+:$/.test(c) ? "right" : "left"; });
      i += 2; const rows = [];
      while (i < lines.length && lines[i].trim() !== "" && lines[i].indexOf("|") >= 0) { rows.push(splitRow(lines[i])); i++; }
      out += '<div class="tablewrap"><table><thead><tr>' + head.map(function (c, k) { return '<th style="text-align:' + (al[k] || "left") + '">' + inline(c) + "</th>"; }).join("") +
        "</tr></thead><tbody>" + rows.map(function (r) { return "<tr>" + r.map(function (c, k) { return '<td style="text-align:' + (al[k] || "left") + '">' + inline(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
      continue;
    }
    if (LIST_RE.test(line)) {
      flush(); const items = [];
      while (i < lines.length) {
        if (lines[i].trim() === "" && i + 1 < lines.length && LIST_RE.test(lines[i + 1])) { i++; continue; }
        const mm = lines[i].match(LIST_RE); if (!mm) break;
        items.push({ indent: mm[1].replace(/\t/g, "    ").length, ordered: /\d/.test(mm[2]), num: parseInt(mm[2], 10) || 1, text: mm[3] }); i++;
      }
      out += mdList(items); continue;
    }
    if (line.trim() === "") { flush(); i++; continue; }
    para.push(line); i++;
  }
  flush(); return out;
}

      const res = build.media ? puter.ai.chat(build.prompt, build.media, false, opts) : puter.ai.chat(build.messages, false, opts);
      const r = await res;
      if (r && typeof r[Symbol.asyncIterator] === "function") {
        const it = r[Symbol.asyncIterator]();
        for (;;) {
          const step = await Promise.race([it.next(), gen.stopP]);
          if (step === "stopped") { try { if (it.return) it.return(); } catch (_) {} break; }
          if (step.done) break;
          const part = step.value;
          if (part && part.type === "error") throw part;
          if (part && part.text && (!part.type || part.type === "text")) { full += part.text; onText(full); }
        }
      } else { full = extractText(r); onText(full); }
      if (full.trim() || gen.stop) return full;
      lastErr = new Error("empty response");
    } catch (err) {
      lastErr = err; if (full.trim()) { gen.partialErr = err; return full; }
      if (errInfo(err).balance) break;
    }
  }
  throw lastErr || new Error("chat failed");
}
async function imgToBlob(img) {
  try { const r = await fetch(img.src); return await r.blob(); } catch (e) {}
  try {
    const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext("2d").drawImage(img, 0, 0);
    return await new Promise(function (res) { c.toBlob(res, "image/png"); });
  } catch (e) { return null; }
}
async function makeImage(prompt, inputFile) {
  if (typeof window.puter === "undefined" || !puter.ai) { const e = new Error("puter"); e.noPuter = true; throw e; }
  const chain = [S.imgModel || ""]; if (!inputFile && S.imgModel !== FLUX) chain.push(FLUX);
  let lastErr = null;
  for (let k = 0; k < chain.length; k++) {
    const opts = {}; if (chain[k]) opts.model = chain[k]; if (inputFile) opts.input_image = inputFile;
    try {
      const img = Object.keys(opts).length ? await puter.ai.txt2img(prompt, opts) : await puter.ai.txt2img(prompt);
      if (img && img.src) return img;
    } catch (err) { lastErr = err; }
  }
  throw lastErr || new Error("image failed");
}
function lastUploadedImage(chat, upto) {
  for (let i = upto; i >= 0; i--) { const m = chat.messages[i]; if (m.role === "user" && m.images && m.images.length && m.images[0].blob) return m.images[0].blob; }
  return null;
}

/* =========================================================
   Sending
   ========================================================= */
function setBusy(v) {
  sendBtn.textContent = v ? "■" : "➤"; sendBtn.title = v ? t("stop") : ""; sendBtn.setAttribute("aria-label", v ? t("stop") : "Send");
  sendBtn.disabled = false;
}
function send(textArg) {
  if (gen) return;
  const text = (textArg !== undefined ? textArg : promptEl.value).trim();
  if (!text && !attachment) return;
  if (!cur) cur = freshChat();
  const att = attachment, force = forceImg;
  const um = { id: uid(), role: "user", text: text, images: [], created: Date.now() };
  if (att) { if (att.kind === "image") um.images.push({ blob: att.file, kind: "upload" }); else { um.attachName = att.name; um.attachText = att.text; } }
  cur.messages.push(um);
  if (!cur.title) cur.title = (text || um.attachName || t("imgPrompt")).replace(/\s+/g, " ").slice(0, 40);
  const bm = { id: uid(), role: "assistant", text: "", images: [], created: Date.now() };
  cur.messages.push(bm);
  promptEl.value = ""; autoGrow(); clearAttachment();
  if (forceImg) { forceImg = false; $("imgToggle").classList.remove("on"); $("imgToggle").setAttribute("aria-pressed", "false"); }
  runGen(cur, um, bm, force);   // starts the Puter call synchronously
}
async function runGen(chat, um, bm, force) {
  let resolveStop; const stopP = new Promise(function (r) { resolveStop = r; });
  gen = { chat: chat, bm: bm, stop: false, stopP: stopP, stopRes: resolveStop, status: t("thinking") };
  setBusy(true);
  const hasImg = um.images && um.images.length && um.images[0].blob;
  const build = hasImg ? { prompt: visionPrompt(chat, um, force), media: um.images[0].blob } : { messages: apiMessages(chat, um, force) };
  persist(chat); renderChat(); renderList();
  let raf = 0, full = "";
  const flush = function () {
    raf = 0; if (cur !== chat) return;
    const mk = full.match(/\[\[(IMAGE|EDIT)\]\]/);
    const body = liveBody(bm); if (!body) return;
    gen.status = mk ? t("makingImage") : (bm.text ? "" : t("thinking"));
    body.innerHTML = botHTML(bm, gen.status); scrollBottom(false);
  };
  const onText = function (acc) {
    full = acc;
    const mk = acc.match(/\[\[(IMAGE|EDIT)\]\]/);
    let shown = mk ? acc.slice(0, mk.index) : acc.replace(/\[{1,2}[A-Z]*\]{0,2}$/, "");
    bm.text = shown.trim();
    if (!raf) raf = requestAnimationFrame(flush);
  };
  try {
    full = await callChat(build, onText);
    if (gen.partialErr && !gen.stop) { bm.error = errText(gen.partialErr); }
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    const mk = full.match(/\[\[(IMAGE|EDIT)\]\]/);
    if (!mk) { bm.text = full.trim(); bm.apiText = bm.text; if (gen.stop && !bm.text) bm.text = t("stopped"); }
    else if (!gen.stop) {
      const intro = full.slice(0, mk.index).trim();
      const gp = full.slice(mk.index + mk[0].length).trim().replace(/^[:\-\s]+/, "") || um.text;
      bm.text = intro; bm.apiText = (intro ? intro + "\n" : "") + "[Image created from prompt: " + gp.slice(0, 200) + "]";
      gen.status = t("makingImage"); const body = liveBody(bm); if (body && cur === chat) body.innerHTML = botHTML(bm, gen.status);
      const inputFile = (mk[1] === "EDIT" || hasImg) ? lastUploadedImage(chat, chat.messages.indexOf(um)) : null;
      const r = await Promise.race([makeImage(gp, mk[1] === "EDIT" ? inputFile : null), stopP]);
      if (r !== "stopped") {
        const blob = await imgToBlob(r);
        bm.images.push(blob ? { blob: blob, kind: "gen", prompt: gp } : { src: r.src, kind: "gen", prompt: gp });
      } else if (!bm.text) bm.text = t("stopped");
    } else if (!bm.text) bm.text = t("stopped");
  } catch (err) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    bm.error = errText(err);
    if (!bm.text) bm.apiText = "";
  }
  gen = null; setBusy(false);
  persist(chat);
  if (cur === chat) renderChat(true);
  renderList();
}
function autoGrow() { promptEl.style.height = "auto"; promptEl.style.height = Math.min(promptEl.scrollHeight, 140) + "px"; }
promptEl.addEventListener("input", autoGrow);
promptEl.addEventListener("keydown", function (e) {
  const desktop = window.matchMedia && matchMedia("(pointer:fine)").matches;
  if (e.key === "Enter" && !e.shiftKey && desktop) { e.preventDefault(); send(); }
});
sendBtn.onclick = function () { if (gen) stopGen(); else send(); };

/* message actions */
wrapEl.addEventListener("click", function (e) {
  const cc = e.target.closest("[data-copycode]");
  if (cc) { const pre = cc.closest(".code").querySelector("pre"); copyText(pre.textContent); return; }
  const img = e.target.closest("figure img");
  if (img) { const lb = document.createElement("div"); lb.className = "lightbox"; lb.innerHTML = '<img alt="">'; lb.firstChild.src = img.src; lb.onclick = function () { lb.remove(); }; document.body.appendChild(lb); return; }
  const b = e.target.closest("[data-act]"); if (!b || !cur) return;
  const el = b.closest(".msg"), idx = cur.messages.findIndex(function (m) { return m.id === el.dataset.id; }), m = cur.messages[idx];
  const act = b.dataset.act;
  if (act === "copy") copyText(m.role === "user" ? (m.text || "") : (m.text || ""));
  else if (act === "regen" || act === "retry") {
    if (gen) return;
    let bi = idx; if (m.role === "user") return;
    let ui = bi - 1; while (ui >= 0 && cur.messages[ui].role !== "user") ui--;
    if (ui < 0) return;
    m.text = ""; m.images = []; m.error = ""; m.apiText = "";
    runGen(cur, cur.messages[ui], m, false);
  } else if (act === "edit") {
    if (gen) return;
    promptEl.value = m.text || ""; autoGrow();
    if (m.images && m.images[0] && m.images[0].blob) { const f = m.images[0].blob; attachment = { kind: "image", file: f, url: URL.createObjectURL(f), name: f.name || "" }; }
    else if (m.attachName) attachment = { kind: "text", name: m.attachName, text: m.attachText };
    renderAttachment();
    cur.messages.length = idx; persist(cur); if (!cur.messages.length) { chats.delete(cur.id); DB.del(cur.id); }
    renderChat(); renderList(); promptEl.focus();
  }
});

/* =========================================================
   Settings
   ========================================================= */
function fillImgModelSelect() {
  const sel = $("setImgModel"); sel.innerHTML = "";
  IMAGE_MODELS.forEach(function (m) { const o = document.createElement("option"); o.value = m[0]; o.textContent = m[1] === "auto" ? t("auto") : m[1]; sel.appendChild(o); });
  sel.value = S.imgModel;
  const ms = $("setModel"); const keep = ms.querySelectorAll("optgroup,option[data-model]");
  if (!keep.length) { ms.innerHTML = ""; }
  let first = ms.querySelector('option[value=""]');
  if (!first) { first = document.createElement("option"); first.value = ""; ms.insertBefore(first, ms.firstChild); }
  first.textContent = t("auto");
  if (S.model && !ms.querySelector('option[value="' + S.model.replace(/"/g, "") + '"]')) { const o = document.createElement("option"); o.value = S.model; o.textContent = S.model; o.setAttribute("data-model", "1"); ms.appendChild(o); }
  ms.value = S.model;
}
function openSettings() {
  $("setLang").value = S.lang; $("setTheme").value = S.theme; $("setCustom").value = S.custom; fillImgModelSelect();
  $("settingsModal").classList.remove("hidden"); closeSide();
}
$("settingsBtn").onclick = openSettings; $("settingsBtn2").onclick = openSettings;
$("closeSettings").onclick = function () { $("settingsModal").classList.add("hidden"); };
$("settingsModal").addEventListener("click", function (e) { if (e.target === this) this.classList.add("hidden"); });
$("setLang").onchange = function () { S.lang = this.value; saveSettings(); applyLang(); };
$("setTheme").onchange = function () { S.theme = this.value; saveSettings(); applyTheme(); };
$("setModel").onchange = function () { S.model = this.value; saveSettings(); };
$("setImgModel").onchange = function () { S.imgModel = this.value; saveSettings(); };
$("setCustom").oninput = function () { S.custom = this.value.slice(0, 1000); saveSettings(); };
$("loadModels").onclick = async function () {
  const btn = this; btn.textContent = t("loadingModels");
  try {
    if (typeof window.puter === "undefined" || !puter.ai || !puter.ai.listModels) throw new Error("no listModels");
    const list = await puter.ai.listModels();
    const ms = $("setModel"); ms.innerHTML = ""; const auto = document.createElement("option"); auto.value = ""; auto.textContent = t("auto"); ms.appendChild(auto);
    const groups = {};
    list.forEach(function (m) { if (m && m.id) (groups[m.provider || "other"] = groups[m.provider || "other"] || []).push(m); });
    Object.keys(groups).sort().forEach(function (p) {
      const g = document.createElement("optgroup"); g.label = p;
      groups[p].forEach(function (m) { const o = document.createElement("option"); o.value = m.id; o.textContent = m.name || m.id; g.appendChild(o); });
      ms.appendChild(g);
    });
    ms.value = S.model;
  } catch (e) { toast(t("modelsFail")); }
  btn.textContent = t("loadModels");
};
function chatAsText(c) {
  return (c.title || t("appName")) + "\n" + "=".repeat(20) + "\n\n" + c.messages.map(function (m) {
    return (m.role === "user" ? "You: " : "AI: ") + (m.text || "") + ((m.images && m.images.length) ? " [" + t("imgPrompt") + "]" : "") + (m.attachName ? " [" + m.attachName + "]" : "");
  }).join("\n\n");
}
$("exportBtn").onclick = function () {
  if (!cur || !cur.messages.length) return;
  const blob = new Blob([chatAsText(cur)], { type: "text/plain" }), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = (cur.title || "chat").replace(/[^\w\- ]+/g, "").slice(0, 30) + ".txt"; document.body.appendChild(a); a.click(); a.remove();
  toast(t("exported"));
};
$("delAllBtn").onclick = async function () {
  if (!confirm(t("confirmAll"))) return;
  stopGen(); chats.clear(); await DB.clear(); cur = freshChat(); renderChat(); renderList(); $("settingsModal").classList.add("hidden");
};
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { $("settingsModal").classList.add("hidden"); closeSide(); const lb = document.querySelector(".lightbox"); if (lb) lb.remove(); }
});

/* =========================================================
   Boot
   ========================================================= */
(async function init() {
  applyTheme();
  try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", function () { if (S.theme === "auto") applyTheme(); }); } catch (e) {}
  await DB.open();
  (await DB.all()).forEach(function (c) { if (c && c.messages && c.messages.length) chats.set(c.id, c); });
  cur = freshChat();
  setBusy(false); applyLang(); autoGrow();
  window.__hotunaReady = true;
})();
</script>

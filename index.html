<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Hotuna</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root { --bg:#212121; --panel:#2f2f2f; --text:#ececec; --muted:#9b9b9b; --accent:#4f8cff; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid #333; }
  header h1 { font-size:18px; margin:0; }
  .actions { display:flex; gap:8px; }
  .actions button { background:var(--panel); color:var(--text); border:none; padding:8px 12px; border-radius:8px; font-size:14px; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:85%; padding:12px 14px; border-radius:16px; line-height:1.45; word-wrap:break-word; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--panel); border-bottom-left-radius:4px; }
  .bot img { max-width:100%; border-radius:10px; display:block; margin-top:8px; }
  .dl { display:inline-block; margin-top:8px; color:var(--accent); font-size:14px; text-decoration:none; }
  .modes { display:flex; gap:8px; padding:8px 12px 0; }
  .modes button { flex:1; padding:10px; border:none; border-radius:10px; background:var(--panel); color:var(--muted); font-size:15px; }
  .modes button.active { background:var(--accent); color:#fff; }
  .hint { color:var(--muted); font-size:12px; text-align:center; padding:6px 16px 0; }
  form { display:flex; gap:8px; padding:8px 12px 14px; }
  textarea { flex:1; resize:none; height:48px; max-height:120px; padding:12px; border-radius:14px; border:none; background:var(--panel); color:var(--text); font-size:16px; font-family:inherit; }
  form button { width:48px; height:48px; border:none; border-radius:50%; background:var(--accent); color:#fff; font-size:20px; }
  form button:disabled { opacity:.5; }
</style>
</head>
<body>
  <header>
    <h1 id="title"></h1>
    <div class="actions">
      <button id="newChat"></button>
      <button id="langBtn"></button>
    </div>
  </header>

  <div id="chat"></div>

  <div class="modes">
    <button id="modeImg" type="button"></button>
    <button id="modeChat" type="button"></button>
  </div>
  <div class="hint" id="hint"></div>

  <form id="form">
    <textarea id="prompt" rows="1"></textarea>
    <button id="send" type="submit">➤</button>
  </form>

<script>
const T = {
  ha: {
    title: "AI Hotuna",
    welcome: "Sannu! Zaɓi 🖼 Hoto don yin hoto, ko 💬 Tattaunawa don yin tambaya.",
    phImg: "Rubuta bayanin hoton da kake so...",
    phChat: "Yi tambaya ko rubuta saƙo...",
    hintImg: "Shawara: Turanci yana ba da hotuna mafi kyau.",
    hintChat: "Zan amsa maka da Hausa ko Turanci.",
    making: "Ana yin hoton...",
    thinking: "Ina tunani...",
    error: "An samu matsala. Sake gwadawa.",
    download: "Sauke hoto",
    newchat: "Sabo",
    modeImg: "🖼 Hoto",
    modeChat: "💬 Tattaunawa",
    lang: "English"
  },
  en: {
    title: "AI Images",
    welcome: "Hello! Choose 🖼 Image to create a picture, or 💬 Chat to ask a question.",
    phImg: "Describe the image you want...",
    phChat: "Ask a question or write a message...",
    hintImg: "Tip: English prompts give the best images.",
    hintChat: "I can answer in Hausa or English.",
    making: "Creating your image...",
    thinking: "Thinking...",
    error: "Something went wrong. Please try again.",
    download: "Download image",
    newchat: "New",
    modeImg: "🖼 Image",
    modeChat: "💬 Chat",
    lang: "Hausa"
  }
};

let lang = "ha";
let mode = "img";
try { lang = localStorage.getItem("lang") || "ha"; } catch (e) {}

let history = [];

const chat = document.getElementById("chat");
const promptEl = document.getElementById("prompt");
const sendBtn = document.getElementById("send");

function addMsg(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = t.title;
  document.getElementById("newChat").textContent = t.newchat;
  document.getElementById("langBtn").textContent = t.lang;
  document.getElementById("modeImg").textContent = t.modeImg;
  document.getElementById("modeChat").textContent = t.modeChat;
  document.getElementById("modeImg").className = mode === "img" ? "active" : "";
  document.getElementById("modeChat").className = mode === "chat" ? "active" : "";
  promptEl.placeholder = mode === "img" ? t.phImg : t.phChat;
  document.getElementById("hint").textContent = mode === "img" ? t.hintImg : t.hintChat;
  const w = document.getElementById("welcome");
  if (w) w.textContent = t.welcome;
}

function resetChat() {
  chat.innerHTML = "";
  history = [];
  const w = addMsg("bot", T[lang].welcome);
  w.id = "welcome";
}

function extractText(r) {
  if (!r) return "";
  if (typeof r === "string") return r;
  const c = r.message ? r.message.content : r.content;
  if (typeof c === "string") return c;
  if (Array.isArray(c)) return c.map(function (x) { return x.text || ""; }).join("");
  if (r.text) return r.text;
  return String(r);
}

document.getElementById("langBtn").onclick = function () {
  lang = lang === "ha" ? "en" : "ha";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  applyLang();
};

document.getElementById("modeImg").onclick = function () { mode = "img"; applyLang(); };
document.getElementById("modeChat").onclick = function () { mode = "chat"; applyLang(); };

document.getElementById("newChat").onclick = function () {
  resetChat();
  applyLang();
};

promptEl.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("form").requestSubmit();
  }
});

document.getElementById("form").onsubmit = async function (e) {
  e.preventDefault();
  const p = promptEl.value.trim();
  if (!p) return;
  promptEl.value = "";
  addMsg("user", p);
  sendBtn.disabled = true;

  if (mode === "img") {
    const bot = addMsg("bot", T[lang].making);
    try {
      const img = await puter.ai.txt2img(p);
      bot.textContent = "";
      bot.appendChild(img);
      const a = document.createElement("a");
      a.className = "dl";
      a.href = img.src;
      a.download = "hoto.png";
      a.textContent = "⬇ " + T[lang].download;
      bot.appendChild(a);
    } catch (err) {
      bot.textContent = T[lang].error;
    }
  } else {
    const bot = addMsg("bot", T[lang].thinking);
    history.push({ role: "user", content: p });
    try {
      const msgs = [{
        role: "system",
        content: "You are a helpful assistant. Always reply in the same language the user writes in (Hausa or English). Keep answers clear and well organised."
      }].concat(history);
      const r = await puter.ai.chat(msgs);
      const text = extractText(r) || T[lang].error;
      bot.textContent = text;
      history.push({ role: "assistant", content: text });
    } catch (err) {
      bot.textContent = T[lang].error;
      history.pop();
    }
  }

  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
};

resetChat();
applyLang();
</script>
</body>
</html>

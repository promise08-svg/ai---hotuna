
<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Hotuna</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  body { font-family: sans-serif; background:#111; color:#fff; margin:0; padding:20px; text-align:center; }
  h1 { font-size:24px; }
  textarea { width:100%; max-width:400px; height:90px; padding:10px; border-radius:8px; border:none; font-size:16px; }
  button { margin-top:12px; padding:12px 28px; font-size:16px; border:none; border-radius:8px; background:#4f8cff; color:#fff; }
  #status { margin-top:15px; }
  #out img { max-width:100%; margin-top:20px; border-radius:10px; }
</style>
</head>
<body>
  <h1>Yi Hoto da AI</h1>
  <textarea id="prompt" placeholder="Rubuta abin da kake so a yi hoton sa (a Turanci)..."></textarea><br>
  <button id="btn">Generate</button>
  <div id="status"></div>
  <div id="out"></div>

<script>
document.getElementById("btn").onclick = async function () {
  const p = document.getElementById("prompt").value.trim();
  if (!p) return;
  const status = document.getElementById("status");
  const out = document.getElementById("out");
  status.textContent = "Ana yi... (idan ya nemi ka shiga da asusun Puter, ka amince)";
  try {
    const img = await puter.ai.txt2img(p);
    out.innerHTML = "";
    out.appendChild(img);
    status.textContent = "";
  } catch (e) {
    status.textContent = "An samu matsala, sake gwadawa.";
  }
};
</script>
</body>
</html>

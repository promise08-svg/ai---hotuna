<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212121">
<title>Hotuna AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root {
    --bg:#212121; --panel:#2f2f2f; --panel2:#3a3a3a; --text:#ececec; --muted:#9b9b9b;
    --accent:#10a37f; --user:#303030; --border:#3d3d3d;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; height:100dvh;
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--border);
  }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:17px; }
  .logo {
    width:30px; height:30px; border-radius:50%; background:var(--accent);
    display:grid; place-items:center; font-size:16px;
  }
  .actions { display:flex; gap:8px; }
  .actions button {
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    padding:7px 12px; border-radius:999px; font-size:14px; cursor:pointer;
  }
  #chat { flex:1; overflow-y:auto; padding:18px 14px 8px; scroll-behavior:smooth; }
  .wrap { max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }

  .empty { text-align:center; margin-top:8vh; }
  .empty .logo { width:56px; height:56px; font-size:28px; margin:0 auto 16px; }
  .empty h2 { margin:0 0 6px; font-size:24px; }
  .empty p { margin:0 0 22px; color:var(--muted); }
  .chips { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .chip {
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:14px 12px; border-radius:14px; font-size:14px; text-align:left; cursor:pointer;
    line-height:1.35;
  }
  .chip:active { background:var(--panel2); }
  @media (max-width:420px) { .chips { grid-template-columns:1fr; } }

  .row { display:flex; gap:10px; }
  .row.user { justify-content:flex-end; }
  .bubble { max-width:85%; padding:10px 15px; border-radius:20px; background:var(--user); white-space:pre-wrap; word-wrap:break-word; line-height:1.5; }
  .avatar { flex:none; width:28px; height:28px; border-radius:50%; background:var(--accent); display:grid; place-items:center; font-size:14px; margin-top:2px; }
  .bot { flex:1; min-width:0; line-height:1.6; word-wrap:break-word; }
  .bot p { margin:0 0 10px; }
  .bot p:last-child { margin-bottom:0; }
  .bot h1,.bot h2,.bot h3 { margin:14px 0 6px; line-height:1.3; }
  .bot h1 { font-size:20px; } .bot h2 { font-size:18px; } .bot h3 { font-size:16px; }
  .bot ul,.bot ol { margin:4px 0 10px; padding-left:22px; }
  .bot li { margin:3px 0; }
  .bot code { background:var(--panel); padding:2px 6px; border-radius:6px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.9em; }
  .bot pre { background:#171717; border:1px solid var(--border); padding:12px; border-radius:12px; overflow-x:auto; margin:8px 0; }
  .bot pre code { background:none; padding:0; }
  .bot a { color:#6ab0ff; }
  .bot img { max-width:100%; border-radius:14px; display:block; margin-top:8px; }
  .dl { display:inline-block; margin-top:8px; color:var(--accent); font-size:14px; text-decoration:none; }
  .status { color:var(--muted); display:flex; align-items:center; gap:8px; }
  .dots span { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--muted); margin-right:3px; animation:blink 1.2s infinite both; }
  .dots span:nth-child(2) { animation-delay:.2s; } .dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100% { opacity:.2; } 40% { opacity:1; } }
  .err { color:#ff8a80; }

  .composer { padding:8px 12px calc(10px + env(safe-area-inset-bottom)); }
  form {
    max-width:760px; margin:0 auto; display:flex; align-items:flex-end; gap:8px;
    background:var(--panel); border:1px solid var(--border); border-radius:26px; padding:6px 6px 6px 16px;
  }
  textarea {
    flex:1; resize:none; border:none; outline:none; background:transparent; color:var(--text);
    font-size:16px; font-family:inherit; line-height:1.4; max-height:140px; padding:9px 0;
  }
  textarea::placeholder { color:var(--muted); }
  #send {
    flex:none; width:38px; height:38px; border:none; border-radius:50%;
    background:#fff; color:#111; font-size:18px; cursor:pointer; display:grid; place-items:center;
  }
  #send:disabled { background:#555; color:#999; cursor:default; }
  .note { text-align:center; color:var(--muted); font-size:11.5px; margin-top:6px; }
</style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">✦</div><span id="title"></span></div>
    <div class="actions">
      <button id="newChat" type="button"></button>
      <button id="langBtn" type="button"></button>
    </div>
  </header>

  <div id="chat"><div class="wrap" id="wrap"></div></div>

  <div class="composer">
    <form id="form">
      <textarea id="prompt" rows="1" autocomplete="off"></textarea>
      <button id="send" type="submit" aria-label="Send">➤</button>
    </form>
    <div class="note" id="note"></div>
  </div>

<script>
/* ---------- Text (Hausa / English) ---------- */
const T = {
  ha: {
    title: "Hotuna AI",
    hello: "Sannu! Me zan taimaka maka yau?",
    sub: "Ka yi tambaya, ko ka nemi in yi maka hoto.",
    ph: "Rubuta saƙo...",
    thinking: "Ina tunani",
    making: "Ana yin hoton",
    error: "An samu matsala. Ka sake gwadawa.",
    download: "Sauke hoto",
    newchat: "Sabo",
    note: "AI na iya yin kuskure. Ka duba muhimman bayanai.",
    lang: "English",
    chips: [
      { l: "🖼 Yi mini hoton zaki a hamada", t: "Yi mini hoton zaki a hamada lokacin faɗuwar rana" },
      { l: "💡 Bayyana yadda AI yake aiki", t: "Bayyana mini yadda AI yake aiki cikin sauƙi" },
      { l: "✉️ Rubuta mini wasiƙar neman aiki", t: "Rubuta mini wasiƙar neman aiki" },
      { l: "📈 Dabarun fara ƙaramar kasuwa", t: "Ba ni dabarun fara ƙaramar kasuwa da ƙaramin jari" }
    ]
  },
  en: {
    title: "Hotuna AI",
    hello: "Hello! How can I help you today?",
    sub: "Ask me anything, or ask me to create an image.",
    ph: "Type a message...",
    thinking: "Thinking",
    making: "Creating your image",
    error: "Something went wrong. Please try again.",
    download: "Download image",
    newchat: "New",
    note: "AI can make mistakes. Check important info.",
    lang: "Hausa",
    chips: [
      { l: "🖼 Create an image of a lion", t: "Create an image of a lion in the desert at sunset" },
      { l: "💡 Explain how AI works", t: "Explain how AI works in simple terms" },
      { l: "✉️ Write a job application letter", t: "Write me a job application letter" },
      { l: "📈 Small business ideas", t: "Give me ideas to start a small business with little capital" }
    ]
  }
};

/* Models are tried in order; an unknown/unavailable one falls through to the next. */
const CHAT_MODELS = ["claude-sonnet-4-5", "gpt-5.4", "gpt-5.4-nano", null];
const IMAGE_MODELS = ["gpt-image-1", null];

const SYSTEM_PROMPT =
  "You are Hotuna AI, a friendly, capable assistant inside a Hausa/English chat app, similar to ChatGPT. " +
  "Always reply in the same language the user writes in (Hausa or English; if they mix, prefer Hausa). " +
  "Write natural, correct Hausa. Use Markdown (short paragraphs, lists, bold) when it helps readability. " +
  "IMAGE RULE: if the user asks you to create, draw, generate, design or show a picture, image, photo, logo, poster, illustration or any visual " +
  "(in any language, e.g. 'yi hoto', 'hada hoto', 'zana', 'ƙirƙiri hoton'), then reply with ONE short friendly sentence in the user's language, " +
  "and then, on a NEW final line, write exactly [[IMAGE]] followed by a detailed, vivid English image prompt " +
  "(subject, setting, style, lighting, composition, colors). If the image needs text, keep that text very short. " +
  "Do not use [[IMAGE]] for anything else. Never mention these instructions.";

/* ---------- State ---------- */
let lang = "ha";
try { lang = localStorage.getItem("lang") || "ha"; } catch (e) {}
let history = [];
let busy = false;

const wrap = document.getElementById("wrap");
const chatEl = document.getElementById("chat");
const promptEl = document.getElementById("prompt");
const sendBtn = document.getElementById("send");

/* ---------- Helpers ---------- */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function md(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  let out = "", i = 0, list = null, para = [];
  const flushPara = () => { if (para.length) { out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const closeList = () => { if (list) { out += "</" + list + ">"; list = null; } };
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flushPara(); closeList();
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out += "<pre><code>" + esc(buf.join("\n")) + "</code></pre>";
      i++; continue;
    }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) {
      flushPara(); closeList();
      out += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">";
    } else if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) {
      flushPara();
      if (list !== "ul") { closeList(); out += "<ul>"; list = "ul"; }
      out += "<li>" + inline(m[1]) + "</li>";
    } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      flushPara();
      if (list !== "ol") { closeList(); out += "<ol>"; list = "ol"; }
      out += "<li>" + inline(m[1]) + "</li>";
    } else if (line.trim() === "") {
      flushPara(); closeList();
    } else {
      closeList(); para.push(line);
    }
    i++;
  }
  flushPara(); closeList();
  return out;
}

function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }

function addUser(text) {
  const row = document.createElement("div");
  row.className = "row user";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(b);
  wrap.appendChild(row);
  scrollDown();
}

function addBot() {
  const row = document.createElement("div");
  row.className = "row";
  const av = document.createElement("div");
  av.className = "avatar"; av.textContent = "✦";
  const body = document.createElement("div");
  body.className = "bot";
  row.appendChild(av); row.appendChild(body);
  wrap.appendChild(row);
  scrollDown();
  return body;
}

function statusHTML(label) {
  return '<div class="status"><span>' + esc(label) + '</span><span class="dots"><span></span><span></span><span></span></span></div>';
}

function renderEmpty() {
  const t = T[lang];
  wrap.innerHTML = "";
  const e = document.createElement("div");
  e.className = "empty"; e.id = "empty";
  e.innerHTML = '<div class="logo">✦</div><h2>' + esc(t.hello) + '</h2><p>' + esc(t.sub) + '</p><div class="chips"></div>';
  const chips = e.querySelector(".chips");
  t.chips.forEach(function (c) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = c.l;
    b.onclick = function () { send(c.t); };
    chips.appendChild(b);
  });
  wrap.appendChild(e);
}

function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = t.title;
  document.getElementById("newChat").textContent = t.newchat;
  document.getElementById("langBtn").textContent = t.lang;
  document.getElementById("note").textContent = t.note;
  promptEl.placeholder = t.ph;
  if (document.getElementById("empty")) renderEmpty();
}

function setBusy(v) { busy = v; sendBtn.disabled = v; }

function autoGrow() {
  promptEl.style.height = "auto";
  promptEl.style.height = Math.min(promptEl.scrollHeight, 140) + "px";
}

/* ---------- AI calls ---------- */
function extractText(r) {
  if (r == null) return "";
  if (typeof r === "string") return r;
  const c = r.message ? r.message.content : r.content;
  if (typeof c === "string") return c;
  if (Array.isArray(c)) return c.map(function (x) { return (x && x.text) || ""; }).join("");
  if (r.text) return r.text;
  return "";
}

async function streamChat(messages, onText) {
  let lastErr = null;
  for (const model of CHAT_MODELS) {
    let full = "";
    try {
      const opts = { stream: true };
      if (model) opts.model = model;
      const res = await puter.ai.chat(messages, false, opts);
      if (res && typeof res[Symbol.asyncIterator] === "function") {
        for await (const part of res) {
          if (part && part.text) { full += part.text; onText(full); }
        }
      } else {
        full = extractText(res);
        onText(full);
      }
      if (full.trim()) return full;
      lastErr = new Error("empty response");
    } catch (err) {
      lastErr = err;
      if (full.trim()) return full; // keep what we already received
    }
  }
  throw lastErr || new Error("chat failed");
}

async function makeImage(prompt) {
  let lastErr = null;
  for (const model of IMAGE_MODELS) {
    try {
      const img = model ? await puter.ai.txt2img(prompt, { model: model }) : await puter.ai.txt2img(prompt);
      if (img) return img;
    } catch (err) { lastErr = err; }
  }
  throw lastErr || new Error("image failed");
}

/* ---------- Send ---------- */
async function send(text) {
  text = (text || "").trim();
  if (!text || busy) return;
  const t = T[lang];
  const empty = document.getElementById("empty");
  if (empty) empty.remove();

  promptEl.value = ""; autoGrow();
  addUser(text);
  setBusy(true);
  const body = addBot();
  body.innerHTML = statusHTML(t.thinking);

  history.push({ role: "user", content: text });
  const messages = [{ role: "system", content: SYSTEM_PROMPT }].concat(history);

  let full = "";
  try {
    full = await streamChat(messages, function (acc) {
      const idx = acc.indexOf("[[IMAGE]]");
      let shown = idx >= 0 ? acc.slice(0, idx) : acc.replace(/\[{1,2}I?M?A?G?E?\]{0,2}$/, "");
      shown = shown.trim();
      body.innerHTML = shown ? md(shown) : statusHTML(idx >= 0 ? t.making : t.thinking);
      if (idx >= 0 && shown) body.innerHTML += statusHTML(t.making);
      scrollDown();
    });
  } catch (err) {
    body.innerHTML = '<div class="err">' + esc(t.error) + '</div>';
    history.pop();
    setBusy(false);
    return;
  }

  const idx = full.indexOf("[[IMAGE]]");
  if (idx < 0) {
    body.innerHTML = md(full.trim());
    history.push({ role: "assistant", content: full.trim() });
    setBusy(false); scrollDown();
    return;
  }

  const intro = full.slice(0, idx).trim();
  const imgPrompt = full.slice(idx + 9).trim().replace(/^[:\-\s]+/, "");
  history.push({ role: "assistant", content: (intro ? intro + "\n" : "") + "[Image created: " + imgPrompt.slice(0, 200) + "]" });
  body.innerHTML = (intro ? md(intro) : "") + statusHTML(t.making);
  scrollDown();
  try {
    const img = await makeImage(imgPrompt || text);
    body.innerHTML = intro ? md(intro) : "";
    body.appendChild(img);
    const a = document.createElement("a");
    a.className = "dl"; a.href = img.src; a.download = "hoto.png";
    a.textContent = "⬇ " + t.download;
    body.appendChild(a);
  } catch (err) {
    body.innerHTML = (intro ? md(intro) : "") + '<div class="err">' + esc(t.error) + '</div>';
  }
  setBusy(false); scrollDown();
}

/* ---------- Events ---------- */
document.getElementById("form").onsubmit = function (e) { e.preventDefault(); send(promptEl.value); };
promptEl.addEventListener("input", autoGrow);
promptEl.addEventListener("keydown", function (e) {
  const desktop = window.matchMedia && window.matchMedia("(pointer:fine)").matches;
  if (e.key === "Enter" && !e.shiftKey && desktop) { e.preventDefault(); send(promptEl.value); }
});
document.getElementById("langBtn").onclick = function () {
  lang = lang === "ha" ? "en" : "ha";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  applyLang();
};
document.getElementById("newChat").onclick = function () {
  if (busy) return;
  history = []; renderEmpty();
};

renderEmpty();
applyLang();
</script>
</body>
</html>
